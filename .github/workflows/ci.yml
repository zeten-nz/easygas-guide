# EASY GAS client CI (Phase 10F).
#
# Self-contained frontend gate: lint, typecheck, unit + component tests (the real
# isolated frontend tests, executed via Vitest/jsdom), production build, a
# bundle-size budget, dependency audits, Playwright spec discovery and browser
# install/cache. The full-stack browser E2E (which needs the server repo) lives
# in e2e-fullstack.yml (cross-repo) — it is never silently skipped nor counted in
# this gate.
#
# Official actions are SHA-PINNED to their verified latest release (the `# vX.Y.Z`
# comment documents the tag) so a re-pointed tag cannot change what runs, and so
# no deprecated runtime (e.g. actions/cache@v4.1.2, rejected by GitHub) remains.
name: client-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (app + tests)
        run: |
          npx tsc -b
          npx tsc -p tsconfig.test.json --noEmit
      - name: Unit + component tests
        run: npm test
      - name: E2E result-guard unit tests (assert-e2e-complete)
        run: npm run test:ci-assert
      - name: Production build
        run: npm run build
      - name: Bundle-size budget
        run: node scripts/bundle-budget.mjs
      - name: Production dependency audit (GATE — fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (report only — dev toolchain advisories)
        run: npm audit || true
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright spec discovery (compiles specs, lists tests)
        run: npm run test:e2e -- --list

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (self-validate workflows)
        uses: raven-actions/actionlint@v2
