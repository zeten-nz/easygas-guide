# EASY GAS full-stack browser E2E (Phase 10F) — CROSS-REPO, PUBLIC repos.
#
# Both repositories are PUBLIC (zeten-nz/easygas-guide, zeten-nz/easygas-guide-server),
# so the server checkout uses a tokenless, read-only, shallow HTTPS clone — NO
# SERVER_REPO_TOKEN, PAT, deploy key, or org secret is required.
#
# Symmetric strategy: a CLIENT pull request tests the client PR branch against
# server `main` (the server repo has the mirror workflow: a server PR tests the
# server PR branch against client `main`). No repository_dispatch is used, so
# there is no cross-repo trigger loop.
#
# Runs on pull_request (blocking check) + push to main + manual dispatch (which
# accepts optional client/server refs for coordinated PR testing).
name: e2e-fullstack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client_ref:
        description: "Client ref to test (default: this ref)"
        required: false
      server_ref:
        description: "Server ref to test (default: main)"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: e2e-fullstack-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_REPO_URL: https://github.com/zeten-nz/easygas-guide-server.git
  SERVER_REF: ${{ github.event.inputs.server_ref || 'main' }}

jobs:
  fullstack:
    name: browser E2E (client PR × server main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_throwaway_root
          MYSQL_DATABASE: easygas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_throwaway_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci_only_throwaway_root
      DB_NAME: easygas
      TEST_DB_NAME: easygas_test
      REDIS_URL: redis://127.0.0.1:6379
      CLIENT_ORIGIN: http://localhost:5173
      TRUST_PROXY_HOPS: "0"
      E2E_API_PORT: "4000"
    steps:
      - name: Checkout client (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: client
          persist-credentials: false
      - name: Clone server (public, tokenless, read-only)
        run: git clone --depth 1 --branch "$SERVER_REF" "$SERVER_REPO_URL" server
      - name: Log the exact client + server refs/SHAs under test
        run: |
          echo "client ref : ${{ github.ref }} (event: ${{ github.event_name }})"
          echo "client SHA : $(git -C client rev-parse HEAD)"
          echo "server ref : $SERVER_REF"
          echo "server SHA : $(git -C server rev-parse HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate a throwaway APP_KEY
        run: echo "APP_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run build
      - name: Install client deps + Playwright Chromium
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fail if zero specs are discovered
        working-directory: client
        run: |
          COUNT=$(npx playwright test --list 2>/dev/null | grep -c '›' || true)
          echo "discovered $COUNT tests"
          if [ "$COUNT" -eq 0 ]; then echo "::error::no Playwright tests discovered"; exit 1; fi
      - name: Run full-stack Playwright (webServer starts ../server harness + Vite; global-setup preflights fixtures)
        working-directory: client
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-e2e.log
      - name: Assert every spec ran AND passed (no skips / failures / empties)
        if: always()
        working-directory: client
        run: node scripts/assert-e2e-complete.mjs test-results.json
      - name: Redact harness logs (drop SMS/OTP lines; scrub phones/coords)
        if: failure() || cancelled()
        working-directory: client
        run: |
          if [ -f playwright-e2e.log ]; then
            sed -E -e '/\[e2e-sms\]/d' \
                   -e 's/\+998[0-9]{9}/+998*********/g' \
                   -e 's/[0-9]{1,3}\.[0-9]{4,}/<coord>/g' \
                   playwright-e2e.log > playwright-e2e.redacted.log || true
            rm -f playwright-e2e.log
          fi
      - name: Upload E2E artifacts (HTML report, traces/screenshots/error-context, JSON, redacted log)
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-client-pr
          path: |
            client/playwright-report
            client/test-results
            client/test-results.json
            client/playwright-e2e.redacted.log
          if-no-files-found: warn
          retention-days: 7
